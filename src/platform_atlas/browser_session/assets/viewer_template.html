<style>
@font-face{font-family:'Atlas Sora';src:url(data:font/woff2;base64,/*__SORA__*/) format('woff2');font-weight:100 800;font-display:swap;}
@font-face{font-family:'Onest';src:url(data:font/woff2;base64,/*__ONEST__*/) format('woff2');font-weight:100 900;font-display:swap;}
@font-face{font-family:'Hanken Grotesk';src:url(data:font/woff2;base64,/*__HANKEN__*/) format('woff2');font-weight:100 900;font-display:swap;}
:root{
  --itl-navy:#101625; --itl-blue:#1B93D2; --itl-orange:#FF6633; --itl-green:#99CA3C; --itl-pink:#C5258F;
  --font-display:'Atlas Sora','Hanken Grotesk',system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-hero:'Onest','Atlas Sora','Hanken Grotesk',system-ui,sans-serif;
  --font-ui:'Hanken Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --fs-display:clamp(1.7rem,2.4vw,2.3rem); --fs-h3:1.25rem; --fs-h4:1.0625rem; --fs-body:.96875rem; --fs-sm:.9rem;
  --fs-meta:.8125rem; --fs-micro:.72rem; --fs-num:1.9rem;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --dur:200ms; --dur-slow:380ms; --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  /* Modern light */
  --paper:#F3F5F9; --surface:#FFFFFF; --elevated:#F6F8FB; --sunken:#E8EDF4; --field:rgba(15,23,42,.045);
  --rule:rgba(15,23,42,.09); --rule-2:rgba(15,23,42,.16); --rule-3:rgba(15,23,42,.30);
  --text-1:#0E1627; --text-2:#45506A; --text-3:#56627A; --text-4:#5F6A80;
  --brass:#915E29; --brass-strong:#7A4E21; --brass-ghost:rgba(224,168,103,.16); --brass-line:rgba(181,119,58,.40); --brass-glow:rgba(224,168,103,.30);
  --action:#E0A867; --action-ink:#1C1206; --sky:#1B93D2;
  --pass:#1B7544; --pass-bg:rgba(27,117,68,.11); --fail:#B3304A; --fail-bg:rgba(179,48,74,.10);
  --warn:#855F08; --warn-bg:rgba(183,128,12,.12); --info:#136B99; --info-bg:rgba(27,147,210,.10);
  --skip:#586277; --skip-bg:rgba(88,98,119,.11); --error:#8A3874; --error-bg:rgba(138,56,116,.10);
  --ink-bg:linear-gradient(180deg,#16213A 0%,#0F1729 58%,#0B1120 100%);
  --ink-1:#E9EDF5; --ink-2:#AAB5CA; --ink-3:#8792AA; --ink-rule:rgba(150,172,214,.10); --ink-rule-2:rgba(150,172,214,.19);
  --ink-brass:#E0A867; --ink-brass-2:#ECBC84; --ink-field:rgba(150,172,214,.06);
  --lift-1:0 1px 2px rgba(15,23,42,.05); --lift-2:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.14);
  --lift-3:0 2px 6px rgba(15,23,42,.06),0 28px 64px -24px rgba(15,23,42,.28);
  --r-1:8px; --r-2:10px; --r-3:14px; --r-4:20px; --rail-w:264px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0A101E; --surface:#111A2C; --elevated:#16213A; --sunken:#070C17; --field:rgba(150,172,214,.06);
  --rule:rgba(150,172,214,.10); --rule-2:rgba(150,172,214,.19); --rule-3:rgba(150,172,214,.32);
  --text-1:#E9EDF5; --text-2:#AAB5CA; --text-3:#8C97AE; --text-4:#7E8AA3;
  --brass:#E0A867; --brass-strong:#ECBC84; --brass-ghost:rgba(224,168,103,.13); --brass-line:rgba(224,168,103,.40); --sky:#4DB4EA;
  --pass:#5CCB8F; --pass-bg:rgba(92,203,143,.13); --fail:#F2737C; --fail-bg:rgba(242,115,124,.13);
  --warn:#F2B544; --warn-bg:rgba(242,181,68,.13); --info:#4DB4EA; --info-bg:rgba(77,180,234,.13);
  --skip:#9AA3B5; --skip-bg:rgba(154,163,181,.13); --error:#E08BC6; --error-bg:rgba(224,139,198,.13);
  --lift-1:inset 0 1px 0 rgba(255,255,255,.04),0 1px 2px rgba(0,0,0,.3); --lift-2:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.25);
  --lift-3:inset 0 1px 0 rgba(255,255,255,.05),0 30px 70px -26px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{font-family:var(--font-ui);font-size:var(--fs-body);background:var(--paper);color:var(--text-1);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
html[data-theme="dark"] body{letter-spacing:.002em;}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;}
a{color:var(--info);text-decoration:none;} a:hover{text-decoration:underline;}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px;}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
[hidden]{display:none !important;}
.mono{font-family:var(--font-mono);font-size:.84em;}

/* ── Rail ── */
.rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail-w);z-index:100;display:flex;flex-direction:column;gap:var(--sp-5);padding:var(--sp-6) var(--sp-4) var(--sp-4);
  background:var(--ink-bg);background-size:100% 100vh;background-repeat:no-repeat;color:var(--ink-1);border-right:1px solid var(--ink-rule);overflow-y:auto;}
.rail-brand{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-2);}
.rail-logo{height:30px;width:auto;flex:none;}
.rail-div{width:1px;height:30px;background:var(--ink-rule-2);}
.rail-word{font-family:var(--font-display);font-weight:700;font-size:var(--fs-h4);line-height:1.1;letter-spacing:-.012em;white-space:nowrap;}
.rail-sub{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-brass);letter-spacing:.06em;margin-top:4px;white-space:nowrap;}
.rail-lbl{font-size:var(--fs-micro);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding:0 var(--sp-2);margin-bottom:-12px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav a{display:flex;align-items:center;gap:var(--sp-3);padding:9px var(--sp-3);border-radius:var(--r-2);color:var(--ink-2);font-weight:500;font-size:var(--fs-sm);text-decoration:none;position:relative;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
.nav a:hover{background:var(--ink-field);color:var(--ink-1);}
.nav a.on{background:rgba(224,168,103,.12);color:var(--ink-1);}
.nav a.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ink-brass);}
.nav a.on svg{color:var(--ink-brass);}
.nav .cnt{margin-left:auto;font-family:var(--font-mono);font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--ink-field);color:var(--ink-2);}
.nav .cnt.bad{background:rgba(242,115,124,.16);color:#F2737C;}
.nav .key{margin-left:auto;font-family:var(--font-mono);font-size:.68rem;color:var(--ink-3);opacity:0;}
.nav a:hover .key{opacity:1;} .nav a:hover .cnt+.key{display:none;}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--sp-3);}
.rail-warn{font-size:var(--fs-meta);line-height:1.45;color:var(--ink-2);border:1px solid var(--ink-rule-2);border-radius:var(--r-2);padding:var(--sp-3);background:var(--ink-field);}
.rail-warn b{color:var(--ink-brass);}
.rail-tools{display:flex;gap:var(--sp-2);}
.tool{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);padding:8px;border-radius:var(--r-1);border:1px solid var(--ink-rule-2);color:var(--ink-2);font-size:var(--fs-meta);transition:all var(--dur) var(--ease);}
.tool:hover{color:var(--ink-1);border-color:var(--ink-brass);}
.tool .ic-sun{display:none;} html[data-theme="dark"] .tool .ic-sun{display:block;} html[data-theme="dark"] .tool .ic-moon{display:none;}

/* ── Doc ── */
.doc{margin-left:var(--rail-w);min-width:0;}
.wrap{max-width:1560px;margin:0 auto;padding:var(--sp-6) clamp(20px,3.4vw,56px) 96px;}
.page{animation:pgin var(--dur-slow) var(--ease-out);}
@keyframes pgin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.ph{display:flex;align-items:flex-end;gap:var(--sp-4);margin-bottom:var(--sp-5);flex-wrap:wrap;}
.ph .t{flex:1;min-width:260px;}
.eyebrow{font-size:var(--fs-micro);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin-bottom:6px;}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--text-1);letter-spacing:-.012em;}
h1{font-size:var(--fs-display);font-weight:700;line-height:1.15;}
h2{font-size:var(--fs-h3);font-weight:700;margin-bottom:var(--sp-3);}
h3{font-size:var(--fs-h4);font-weight:650;margin-bottom:var(--sp-2);}
.sub{color:var(--text-3);font-size:var(--fs-sm);margin-top:6px;max-width:75ch;}

/* ── Buttons, chips, inputs ── */
.btn{display:inline-flex;align-items:center;gap:var(--sp-2);padding:8px 14px;border-radius:var(--r-1);border:1px solid var(--rule-2);background:var(--surface);color:var(--text-1);font-weight:600;font-size:var(--fs-sm);transition:all var(--dur) var(--ease);}
.btn:hover{border-color:var(--brass-line);background:var(--elevated);}
.btn.pri{background:var(--action);color:var(--action-ink);border-color:transparent;}
.btn.pri:hover{background:var(--ink-brass-2);}
.btn.sm{padding:5px 10px;font-size:var(--fs-meta);}
.btn[disabled]{opacity:.45;pointer-events:none;}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--rule-2);background:var(--surface);font-size:var(--fs-meta);font-weight:600;color:var(--text-2);transition:all var(--dur) var(--ease);}
.chip:hover{border-color:var(--brass-line);}
.chip.on{background:var(--brass-ghost);border-color:var(--brass-line);color:var(--text-1);}
.chip .n{font-family:var(--font-mono);font-size:.72rem;color:var(--text-3);}
.search{display:flex;align-items:center;gap:var(--sp-2);padding:7px 12px;border-radius:var(--r-1);border:1px solid var(--rule-2);background:var(--field);min-width:260px;color:var(--text-3);}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text-1);font:inherit;font-size:var(--fs-sm);}
.search:focus-within{border-color:var(--sky);}
select.sel{padding:7px 10px;border-radius:var(--r-1);border:1px solid var(--rule-2);background:var(--surface);color:var(--text-1);font:inherit;font-size:var(--fs-sm);}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:var(--fs-micro);font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
.tag.pass{background:var(--pass-bg);color:var(--pass);} .tag.fail{background:var(--fail-bg);color:var(--fail);} .tag.warn{background:var(--warn-bg);color:var(--warn);}
.tag.info{background:var(--info-bg);color:var(--info);} .tag.skip{background:var(--skip-bg);color:var(--skip);} .tag.error{background:var(--error-bg);color:var(--error);}
.tag.brass{background:var(--brass-ghost);color:var(--brass);}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-4);}
.toolbar .grow{flex:1;}

/* ── Cards / tiles ── */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-3);box-shadow:var(--lift-1);padding:var(--sp-5);}
.card.flush{padding:0;overflow:hidden;}
.grid{display:grid;gap:var(--sp-4);}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr));}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
.tile{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-3);padding:var(--sp-4) var(--sp-5);box-shadow:var(--lift-1);position:relative;overflow:hidden;transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease);}
button.tile:hover{transform:translateY(-2px);border-color:var(--brass-line);}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--skip);}
.tile.fail::before{background:var(--fail);} .tile.warn::before{background:var(--warn);} .tile.info::before{background:var(--sky);} .tile.pass::before{background:var(--pass);} .tile.brass::before{background:var(--action);}
.tile .num{font-family:var(--font-display);font-weight:700;font-size:var(--fs-num);line-height:1.1;}
.tile.fail .num{color:var(--fail);} .tile.warn .num{color:var(--warn);}
.tile .lbl{font-size:var(--fs-meta);color:var(--text-3);font-weight:600;margin-top:4px;}
.hero{background:var(--ink-bg);color:var(--ink-1);border-radius:var(--r-4);padding:var(--sp-6);border:1px solid var(--ink-rule);position:relative;overflow:hidden;margin-bottom:var(--sp-5);}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,rgba(77,180,234,.14),transparent 70%),radial-gradient(500px 200px at 0% 100%,rgba(224,168,103,.10),transparent 70%);pointer-events:none;}
.hero>*{position:relative;z-index:1;}
.hero .eyebrow{color:var(--ink-brass);}
.hero h1{color:var(--ink-1);font-family:var(--font-hero);}
.hero .quote{margin-top:var(--sp-3);font-size:1.05rem;color:var(--ink-2);max-width:80ch;border-left:3px solid var(--ink-brass);padding-left:var(--sp-4);}
.hero .quote.none{border-color:var(--ink-rule-2);font-style:italic;color:var(--ink-3);}
.meta{display:flex;flex-wrap:wrap;gap:var(--sp-5);margin-top:var(--sp-5);}
.meta div{min-width:120px;} .meta .k{font-size:var(--fs-micro);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;}
.meta .v{font-size:var(--fs-sm);color:var(--ink-1);margin-top:2px;word-break:break-all;}
.meta .v.mono{font-size:.8rem;}

/* ── Lists / tables ── */
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm);}
.table th{position:sticky;top:0;z-index:5;background:var(--elevated);text-align:left;font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:10px 14px;border-bottom:1px solid var(--rule-2);font-weight:700;white-space:nowrap;}
.table td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:top;background:var(--surface);}
.table tr.row{cursor:pointer;} .table tr.row:hover td{background:var(--elevated);}
.table td.t{white-space:nowrap;color:var(--text-3);font-family:var(--font-mono);font-size:.8rem;}
.table td.msg{max-width:0;width:100%;} .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
.dim{color:var(--text-3);} .small{font-size:var(--fs-meta);}
.url .host{color:var(--text-3);} .url .path{color:var(--text-1);}
.cluster{display:inline-flex;align-items:center;gap:6px;}
.x{font-family:var(--font-mono);font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--skip-bg);color:var(--text-2);}
.empty{padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--text-3);}
.empty h3{color:var(--text-2);}
.tlist{display:flex;flex-direction:column;}
.lrow{display:flex;gap:var(--sp-3);align-items:flex-start;padding:11px var(--sp-4);border-bottom:1px solid var(--rule);width:100%;text-align:left;}
button.lrow:hover{background:var(--elevated);}
.lrow:last-child{border-bottom:0;}
.lrow .tm{font-family:var(--font-mono);font-size:.78rem;color:var(--text-3);width:52px;flex:none;padding-top:2px;}
.lrow .bd{flex:1;min-width:0;} .lrow .ti{font-weight:600;font-size:var(--fs-sm);word-break:break-word;} .lrow .de{font-size:var(--fs-meta);color:var(--text-3);word-break:break-all;}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px;background:var(--skip);}
.dot.fail{background:var(--fail);} .dot.warn{background:var(--warn);} .dot.info{background:var(--sky);} .dot.brass{background:var(--action);} .dot.pass{background:var(--pass);}
.bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;} .bar i{display:block;height:100%;background:var(--action);}
.digest .lrow .x{margin-left:auto;}

/* timeline */
.tl{position:relative;padding-left:0;}
.tl .ev{display:grid;grid-template-columns:64px 22px 1fr auto;gap:var(--sp-3);align-items:start;padding:10px var(--sp-4);border-bottom:1px solid var(--rule);cursor:pointer;background:var(--surface);}
.tl .ev:hover{background:var(--elevated);}
.tl .ev .tm{font-family:var(--font-mono);font-size:.78rem;color:var(--text-3);padding-top:3px;}
.tl .ev .tm button{font-family:inherit;font-size:inherit;color:var(--info);} .tl .ev .tm button:hover{text-decoration:underline;}
.thumb{width:92px;height:58px;border-radius:6px;object-fit:cover;object-position:top;border:1px solid var(--rule-2);background:var(--sunken);}

/* screenshots */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--sp-4);}
.shot{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-3);overflow:hidden;text-align:left;box-shadow:var(--lift-1);transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.shot:hover{transform:translateY(-3px);border-color:var(--brass-line);}
.shot .im{aspect-ratio:16/10;background:var(--sunken);overflow:hidden;} .shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
.shot .cap{padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:4px;}
.shot .cap .u{font-size:var(--fs-meta);color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* video */
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:var(--sp-4);align-items:start;}
.vbox{background:#000;border-radius:var(--r-3);overflow:hidden;border:1px solid var(--rule-2);}
.vbox video{display:block;width:100%;max-height:72vh;background:#000;}
.vstrip{position:relative;height:26px;margin-top:var(--sp-3);background:var(--sunken);border-radius:99px;border:1px solid var(--rule);cursor:pointer;}
.vstrip .mk{position:absolute;top:4px;bottom:4px;width:4px;margin-left:-2px;border-radius:3px;background:var(--skip);}
.vstrip .mk.fail{background:var(--fail);} .vstrip .mk.warn{background:var(--warn);} .vstrip .mk.info{background:var(--sky);} .vstrip .mk.brass{background:var(--action);width:6px;} .vstrip .mk.pass{background:var(--pass);}
.vstrip .head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-1);margin-left:-1px;pointer-events:none;}
.vlist{max-height:72vh;overflow-y:auto;border:1px solid var(--rule);border-radius:var(--r-3);background:var(--surface);}
.vlist .lrow.cur{background:var(--brass-ghost);box-shadow:inset 3px 0 0 var(--action);}

/* notes */
.note{display:grid;grid-template-columns:1fr auto;gap:var(--sp-4);}
.note p{white-space:pre-wrap;word-break:break-word;font-size:1.02rem;color:var(--text-1);}

/* pre / kv */
pre.code{font-family:var(--font-mono);font-size:.82rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--sunken);border:1px solid var(--rule);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);color:var(--text-1);max-height:340px;overflow:auto;}
.kv{display:grid;grid-template-columns:128px 1fr;gap:6px var(--sp-4);font-size:var(--fs-sm);margin:var(--sp-3) 0;}
.kv .k{color:var(--text-3);font-weight:600;} .kv .v{word-break:break-all;}

.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r-1);overflow:hidden;background:var(--surface);}
.seg button{padding:7px 14px;font-size:var(--fs-sm);font-weight:600;color:var(--text-2);} .seg button.on{background:var(--brass-ghost);color:var(--text-1);box-shadow:inset 0 -2px 0 var(--action);} .seg button[disabled]{opacity:.4;}
